name: Debug DOM Audit APK

on:
  push:
    branches:
      - debug/youtube-dom-gap-audit
    paths:
      - ".github/workflows/debug-dom-audit.yml"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lootbox-debug-dom-audit
  cancel-in-progress: true

jobs:
  build-debug-apk:
    if: github.ref == 'refs/heads/debug/youtube-dom-gap-audit'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout debug branch
        uses: actions/checkout@v4
        with:
          ref: debug/youtube-dom-gap-audit

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK with the default debug keystore
        run: gradle assembleDebug --stacktrace -PverCode=${{ github.run_number }}

      - name: Upload debug DOM audit APK
        uses: actions/upload-artifact@v4
        with:
          name: lootbox-debug-dom-audit
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
