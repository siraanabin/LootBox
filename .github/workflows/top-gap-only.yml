name: Top Gap Only APK
# Branch-only test build; keep main and release untouched.

on:
  push:
    branches:
      - fix/top-gap-only
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lootbox-top-gap-only
  cancel-in-progress: true

jobs:
  build-debug-apk:
    if: github.ref == 'refs/heads/fix/top-gap-only'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout top-gap-only branch
        uses: actions/checkout@v4
        with:
          ref: fix/top-gap-only

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare existing signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing KEYSTORE_BASE64 repository secret."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lootbox.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/lootbox.keystore" >> "$GITHUB_ENV"

      - name: Build the single debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle assembleDebug --stacktrace -PverCode=1008

      - name: Upload the single APK
        uses: actions/upload-artifact@v4
        with:
          name: LootBox-top-gap-only
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish installable update APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-1008
          name: LootBox 3.1008
          target_commitish: fix/top-gap-only
          make_latest: true
          files: app/build/outputs/apk/debug/app-debug.apk
