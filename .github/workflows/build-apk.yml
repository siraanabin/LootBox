name: Build LootBox APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lootbox-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import uploaded project ZIP
        id: import_zip
        shell: bash
        run: |
          shopt -s nullglob
          archives=(LootBox*.zip)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "imported=false" >> "$GITHUB_OUTPUT"
            echo "No LootBox project ZIP uploaded; building current source."
            exit 0
          fi
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected exactly one LootBox*.zip in repository root; found ${#archives[@]}."
            exit 1
          fi
          ARCHIVE="${archives[0]}"
          mkdir -p "$RUNNER_TEMP/lootbox-import"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/lootbox-import"
          ROOT="$RUNNER_TEMP/lootbox-import"
          # Accept ZIPs containing one enclosing project folder.
          mapfile -t TOP_ITEMS < <(find "$ROOT" -mindepth 1 -maxdepth 1)
          if [ "${#TOP_ITEMS[@]}" -eq 1 ] && [ -d "${TOP_ITEMS[0]}" ]; then
            ROOT="${TOP_ITEMS[0]}"
          fi
          if [ ! -f "$ROOT/app/build.gradle.kts" ] || [ ! -f "$ROOT/settings.gradle.kts" ]; then
            echo "ZIP does not contain a valid LootBox Android project at its root."
            exit 1
          fi
          # Keep the active importer/build workflow and repository automation intact.
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='version.json' "$ROOT/" ./
          rm -f "$ARCHIVE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import LootBox project from uploaded ZIP [skip ci]"
            git push origin HEAD:main
          else
            echo "ZIP source matches the current repository; no import commit needed."
          fi
          echo "imported=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing KEYSTORE_BASE64 repository secret."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lootbox.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/lootbox.keystore" >> "$GITHUB_ENV"

      - name: Calculate monotonic app version
        id: calculate_version
        run: |
          CURRENT_CODE=$(python3 -c 'import json; print(json.load(open("version.json")).get("versionCode", 0))')
          if [ "$CURRENT_CODE" -lt 1022 ]; then CURRENT_CODE=1022; fi
          VERSION_CODE=$((CURRENT_CODE + 1))
          VERSION_NAME="3.$VERSION_CODE"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle assembleDebug --stacktrace -PverCode=$VERSION_CODE

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LootBox.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LootBox-APK
          path: LootBox.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.calculate_version.outputs.version_code }}
          name: LootBox ${{ steps.calculate_version.outputs.version_name }}
          files: LootBox.apk
          make_latest: true

      - name: Publish update manifest
        run: |
          cat > version.json <<JSON
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "apkUrl": "https://github.com/siraanabin/LootBox/releases/download/build-$VERSION_CODE/LootBox.apk"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish LootBox $VERSION_NAME update manifest [skip ci]"
            git push origin HEAD:main
          fi
