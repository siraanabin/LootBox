name: Build LootBox APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lootbox-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug --stacktrace -PverCode=${{ github.run_number }}

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LootBox.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LootBox-APK
          path: LootBox.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LootBox 2.${{ github.run_number }}
          files: LootBox.apk
          make_latest: true

      - name: Publish update manifest without GitHub API
        run: |
          cat > version.json <<'JSON'
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "2.${{ github.run_number }}",
            "apkUrl": "https://github.com/siraanabin/LootBox/releases/latest/download/LootBox.apk"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if ! git diff --cached --quiet; then
            git commit -m "Update LootBox release manifest [skip ci]"
            git push origin HEAD:main
          fi
