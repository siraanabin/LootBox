name: Build LootBox APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lootbox-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing KEYSTORE_BASE64 repository secret."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lootbox.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/lootbox.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle assembleDebug --stacktrace -PverCode=${{ github.run_number }}

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LootBox.apk

      - name: Package player redesign source ZIP
        run: |
          mkdir -p player-redesign/app/src/main/java/com/siraanabin/lootbox
          mkdir -p player-redesign/app/src/main/res/layout
          mkdir -p player-redesign/app/src/main/res/drawable
          cp app/src/main/java/com/siraanabin/lootbox/PlayerActivity.kt player-redesign/app/src/main/java/com/siraanabin/lootbox/
          cp app/src/main/res/layout/activity_player.xml player-redesign/app/src/main/res/layout/
          cp app/src/main/res/drawable/player_*.xml player-redesign/app/src/main/res/drawable/
          cp app/src/main/res/drawable/ic_player_*.xml player-redesign/app/src/main/res/drawable/
          cp PLAYER_REDESIGN_README.md player-redesign/README.md
          (cd player-redesign && zip -qr ../LootBox-Premium-Player-Redesign.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: LootBox-Premium-Player-Redesign
          path: LootBox-Premium-Player-Redesign.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LootBox-APK
          path: LootBox.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LootBox 3.${{ github.run_number }}
          files: LootBox.apk
          make_latest: false

      - name: Publish update manifest without GitHub API
        run: |
          CURRENT_CODE=$(python3 -c 'import json; print(json.load(open("version.json")).get("versionCode", 0))')
          if [ "$CURRENT_CODE" -lt 1003 ]; then CURRENT_CODE=1003; fi
          if [ "${{ github.run_number }}" -le "$CURRENT_CODE" ]; then
            echo "Skipping stale manifest update: build ${{ github.run_number }} <= current $CURRENT_CODE"
            exit 0
          fi
          cat > version.json <<'JSON'
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "3.${{ github.run_number }}",
            "apkUrl": "https://github.com/siraanabin/LootBox/releases/latest/download/LootBox.apk"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if ! git diff --cached --quiet; then
            git commit -m "Update LootBox release manifest [skip ci]"
            git push origin HEAD:main
          fi
