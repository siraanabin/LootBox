name: Install LootBox Version 2 and Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version 2 source
        run: |
          cp .github/workflows/build-apk.yml /tmp/installer-workflow.yml
          unzip -q LootBox-Android.zip -d /tmp/lootbox-v2
          test -f /tmp/lootbox-v2/LootBox/app/build.gradle.kts
          sed -i 's/versionName = "1\./versionName = "2./' /tmp/lootbox-v2/LootBox/app/build.gradle.kts
          rm -rf app build.gradle.kts settings.gradle.kts gradle.properties README.md .gitignore
          cp -a /tmp/lootbox-v2/LootBox/. .
          cp /tmp/installer-workflow.yml .github/workflows/build-apk.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Install LootBox Version 2 source"
            git push origin HEAD:main
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Version 2 debug APK
        run: gradle assembleDebug --stacktrace -PverCode=${{ github.run_number }}

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LootBox.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LootBox-Version-2-APK
          path: LootBox.apk

      - name: Publish Version 2 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LootBox 2.${{ github.run_number }}
          files: LootBox.apk
          make_latest: true
