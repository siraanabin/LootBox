name: Build LootBox APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ]; then
            echo "::error::Add the secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_ALIAS (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          # Ignore stray spaces / line breaks / quotes that can sneak in when pasting on a phone
          echo "KEYSTORE_BASE64 length: ${#KS_B64} characters (the original is 3512)"
          if ! printf '%s' "$KS_B64" | tr -d '[:space:]"' | base64 -d > "$RUNNER_TEMP/lootbox.keystore"; then
            echo "::error::KEYSTORE_BASE64 is not valid base64. It was probably cut off or changed while copying. Paste the whole value again."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/lootbox.keystore" -storepass "$KS_PASS" -alias "$KS_ALIAS" > /dev/null 2>&1; then
            echo "::error::Keystore could not be opened. Check that KEYSTORE_BASE64 is complete and that KEYSTORE_PASSWORD and KEY_ALIAS are correct."
            exit 1
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/lootbox.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace -PverCode=${{ github.run_number }}

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LootBox.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LootBox-debug-apk
          path: LootBox.apk

      # The app checks this release to offer in-app updates.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LootBox 1.${{ github.run_number }}
          files: LootBox.apk
          make_latest: true
